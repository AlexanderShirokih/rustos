# Крейт держит межархитектурный API объектов ядра: типизированные capability и владение ими
# выражаются одинаково на любой архитектуре.
[workspace]

[package]
name = "kernel-objects"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
test = false
bench = false
doctest = false

[dependencies]
bootstrap-abi = { path = "../bootstrap-abi" }
collections = { path = "../collections" }
io = { path = "../io" }
ipc = { path = "../ipc" }
syscall = { path = "../syscall" }
syscall-user = { path = "../syscall-user" }

[lints]
workspace = true

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("molecular"))'] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_docs_in_private_items = "allow"
doc_markdown = "allow"
inline_always = "allow"
return_self_not_must_use = "allow"
undocumented_unsafe_blocks = "warn"
unwrap_used = "deny"
cast_possible_truncation = "allow"
cast_sign_loss = "warn"
cast_lossless = "warn"
