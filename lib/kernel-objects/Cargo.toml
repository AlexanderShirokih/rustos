# Крейт держит межархитектурный API объектов ядра: типизированные capability и владение ими
# выражаются одинаково на любой архитектуре.
[package]
license.workspace = true
name = "kernel-objects"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
bench = false

[features]
rustc-dep-of-std = [
    "dep:core",
    "bootstrap-abi/rustc-dep-of-std",
    "io/rustc-dep-of-std",
    "ipc/rustc-dep-of-std",
    "log-abi/rustc-dep-of-std",
    "syscall/rustc-dep-of-std",
    "syscall-user/rustc-dep-of-std",
]

[dependencies]
bootstrap-abi = { workspace = true }
io = { workspace = true }
ipc = { workspace = true }
log-abi = { workspace = true }
syscall = { workspace = true }
syscall-user = { workspace = true }
core = { version = "1.0.0", optional = true, package = "rustc-std-workspace-core" }

[lints]
workspace = true
