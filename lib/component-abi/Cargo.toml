[package]
name = "component-abi"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Крейт попадает в граф зависимостей стандартной библиотеки: `core` берётся из её дерева.
rustc-dep-of-std = ["dep:core", "ipc/rustc-dep-of-std"]

[dependencies]
ipc = { workspace = true }
syscall = { workspace = true }
core = { version = "1.0.0", optional = true, package = "rustc-std-workspace-core" }

[dev-dependencies]
ipc-test = { workspace = true }

[lints]
workspace = true
