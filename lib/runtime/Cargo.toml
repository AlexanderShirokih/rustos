# Крейт собирается как зависимость `std`, поэтому живёт вне основного workspace.
[workspace]

[package]
name = "runtime"
version = "0.1.0"
edition = "2024"
publish = false

# Код крейта содержит aarch64-асм, а `forced-target` вне корневого workspace недоступен. Без
# ключа `arch` проверка слоёв считает крейт нейтральным. Ключом `process-state` крейт
# объявляет, что держит состояние процесса.
[package.metadata.molecular]
arch = "aarch64"
process-state = true

[lib]
path = "src/lib.rs"
test = false
bench = false
doctest = false

[features]
rustc-dep-of-std = [
    "dep:core",
    "dep:alloc",
    "ipc/rustc-dep-of-std",
    "log-abi/rustc-dep-of-std",
    "syscall/rustc-dep-of-std",
    "syscall-user/rustc-dep-of-std",
]

[dependencies]
ipc = { path = "../ipc" }
log-abi = { path = "../log-abi" }
syscall = { path = "../syscall" }
syscall-user = { path = "../syscall-user" }
core = { version = "1.0.0", optional = true, package = "rustc-std-workspace-core" }
alloc = { version = "1.0.0", optional = true, package = "rustc-std-workspace-alloc" }

[lints]
workspace = true

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("molecular"))'] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_docs_in_private_items = "allow"
doc_markdown = "allow"
inline_always = "allow"
return_self_not_must_use = "allow"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "deny"
# Операции, паникующие на неверном значении, запрещены рабочему коду. Тестовый выведен
# из-под запрета `clippy.toml` и снятиями в корнях крейтов.
unwrap_used = "deny"
unwrap_in_result = "deny"
expect_used = "deny"
indexing_slicing = "deny"
missing_asserts_for_indexing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
# Крейт `no_std` обращается к `core`, а хостовые инструменты снимают запрет в своём корне.
std_instead_of_core = "deny"
cast_sign_loss = "warn"
cast_lossless = "warn"
