# Крейт собирается как зависимость `std`.
[package]
name = "runtime"
version.workspace = true
edition.workspace = true
publish.workspace = true
workspace = "../std-runtime"

# API крейта одинаков на любой архитектуре, asm-вставки приходят модулями `cfg(target_arch)`.
# Ключом `process-state` крейт объявляет, что держит состояние процесса.
[package.metadata.molecular]
process-state = true

[lib]
path = "src/lib.rs"
test = false
bench = false
doctest = false

[features]
rustc-dep-of-std = [
    "dep:core",
    "dep:alloc",
    "ipc/rustc-dep-of-std",
    "log-abi/rustc-dep-of-std",
    "syscall/rustc-dep-of-std",
    "syscall-user/rustc-dep-of-std",
]

[dependencies]
ipc = { path = "../ipc" }
log-abi = { path = "../log-abi" }
syscall = { path = "../syscall" }
syscall-user = { path = "../syscall-user" }
core = { version = "1.0.0", optional = true, package = "rustc-std-workspace-core" }
alloc = { version = "1.0.0", optional = true, package = "rustc-std-workspace-alloc" }

[lints]
workspace = true
