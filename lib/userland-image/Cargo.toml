[package]
license.workspace = true
name = "userland-image"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Сериализаторы образа и плана (`encode`, `encode_plan`);
# требует `alloc`. По умолчанию выключен, чтобы no_std-парсер не тянул аллокатор.
alloc = []

[dependencies]
userland = { workspace = true }

[dev-dependencies]
userland = { workspace = true, features = ["alloc"] }

[lints]
workspace = true
