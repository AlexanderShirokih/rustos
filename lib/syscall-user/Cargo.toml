# Крейт собирается как зависимость `std`, поэтому живёт вне основного workspace: его граф
# зависимостей задаёт workspace стандартной библиотеки. Зависеть он может только на крейты,
# способные попасть в тот же граф, - сейчас это `lib/syscall` и `lib/ipc`.
[workspace]

[package]
name = "syscall-user"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"
test = false
bench = false
doctest = false

[features]
rustc-dep-of-std = [
    "dep:core",
    "ipc/rustc-dep-of-std",
    "syscall/rustc-dep-of-std",
]

[dependencies]
ipc = { path = "../ipc" }
syscall = { path = "../syscall" }
core = { version = "1.0.0", optional = true, package = "rustc-std-workspace-core" }

[lints]
workspace = true

# Таблица повторяет корневую дословно, комментарии к отдельным правилам лежат там же.
# Расхождение ловит `cargo xtask check-layers`.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unsafe_code = "deny"
# Имя `molecular` в `target_os` задаёт спека таргета в `targets/`, встроенным rustc его не знает:
# хостовая сборка иначе ругается на `target_os` из кода, общего с userspace.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("molecular"))'] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_docs_in_private_items = "allow"
doc_markdown = "allow"
inline_always = "allow"
return_self_not_must_use = "allow"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "deny"
# Операции, паникующие на неверном значении, запрещены рабочему коду. Тестовый выведен
# из-под запрета `clippy.toml` и снятиями в корнях крейтов.
unwrap_used = "deny"
unwrap_in_result = "deny"
expect_used = "deny"
indexing_slicing = "deny"
missing_asserts_for_indexing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
# Крейт `no_std` обращается к `core`, а хостовые инструменты снимают запрет в своём корне.
std_instead_of_core = "deny"
cast_sign_loss = "warn"
cast_lossless = "warn"
