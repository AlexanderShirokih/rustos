# Крейт собирается как зависимость `std`. Зависеть он
# может только на крейты, способные попасть в граф `std`, - сейчас это `lib/syscall` и
# `lib/ipc`.
[package]
name = "syscall-user"
version.workspace = true
edition.workspace = true
publish.workspace = true
workspace = "../std-runtime"

[lib]
path = "src/lib.rs"
test = false
bench = false
doctest = false

[features]
rustc-dep-of-std = [
    "dep:core",
    "ipc/rustc-dep-of-std",
    "syscall/rustc-dep-of-std",
]

[dependencies]
ipc = { path = "../ipc" }
syscall = { path = "../syscall" }
core = { version = "1.0.0", optional = true, package = "rustc-std-workspace-core" }

[lints]
workspace = true
