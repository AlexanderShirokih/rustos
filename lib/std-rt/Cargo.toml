# Крейт собирается как зависимость `std`, поэтому живёт вне основного workspace: его граф
# зависимостей задаёт workspace стандартной библиотеки. Зависеть он может только на крейты,
# способные попасть в тот же граф, — сейчас это `lib/syscall`, у которого своих зависимостей нет.
[workspace]

[package]
name = "molecular-rt"
version = "0.1.0"
edition = "2024"
publish = false

# Код крейта несёт aarch64-асм, а `forced-target` вне корневого workspace недоступен: без этого
# ключа `check-layers` считает крейт нейтральным и пропускает зависимость из нейтрального.
[package.metadata.molecular]
arch = "aarch64"

[lib]
name = "molecular_rt"
path = "src/lib.rs"
test = false
bench = false
doctest = false

[features]
rustc-dep-of-std = [
    "dep:core",
    "dep:alloc",
    "component-abi/rustc-dep-of-std",
    "ipc/rustc-dep-of-std",
    "log-abi/rustc-dep-of-std",
    "syscall/rustc-dep-of-std",
]

[dependencies]
component-abi = { path = "../component-abi" }
ipc = { path = "../ipc" }
log-abi = { path = "../log-abi" }
syscall = { path = "../syscall" }
core = { version = "1.0.0", optional = true, package = "rustc-std-workspace-core" }
alloc = { version = "1.0.0", optional = true, package = "rustc-std-workspace-alloc" }

[lints]
workspace = true

# Таблица повторяет корневую дословно, комментарии к отдельным правилам лежат там же.
# Расхождение ловит `cargo xtask check-layers`.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unsafe_code = "deny"
# Имя таргета Molecular OS задаёт спека в `targets/`, встроенным rustc его не знает: хостовая
# сборка иначе ругается на `target_os` из кода, общего с userspace.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("molecular"))'] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_docs_in_private_items = "allow"
doc_markdown = "allow"
inline_always = "allow"
return_self_not_must_use = "allow"
undocumented_unsafe_blocks = "warn"
unwrap_used = "deny"
cast_possible_truncation = "allow"
cast_sign_loss = "warn"
cast_lossless = "warn"
