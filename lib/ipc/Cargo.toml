[package]
name = "ipc"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Крейт собирается в графе зависимостей стандартной библиотеки: `core` берётся из её дерева.
rustc-dep-of-std = ["dep:core", "syscall/rustc-dep-of-std"]

[dependencies]
core = { version = "1.0.0", optional = true, package = "rustc-std-workspace-core" }
syscall = { workspace = true }

[dev-dependencies]
ipc-test = { workspace = true }

[lints]
workspace = true
