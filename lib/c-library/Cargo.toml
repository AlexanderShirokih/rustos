[package]
license.workspace = true
name = "c-library"
version.workspace = true
edition.workspace = true
publish.workspace = true
# Крейт userspace, и его workspace — `user/`: оттуда идёт сборка под таргет RustOS.
workspace = "../../user"
build = "build.rs"

# Ключом `process-state` крейт объявляет, что держит состояние процесса.
[package.metadata.molecular]
process-state = true

[lib]
test = false
bench = false
doctest = false

[dependencies]
component-startup = { workspace = true }
filesystem-abi = { workspace = true }
filesystem-client = { workspace = true }
log-abi = { workspace = true }
runtime = { workspace = true }
syscall = { workspace = true }

[build-dependencies]
userland-build = { workspace = true }

[lints]
workspace = true
