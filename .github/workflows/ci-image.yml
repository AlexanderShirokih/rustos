name: CI image

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - rust-toolchain.toml
      - .github/workflows/ci-image.yml
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}-ci

jobs:
  build:
    name: build & push
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      # Джобы в контейнере работают от root и оставляют в общей рабочей директории раннера файлы,
      # которые сборка образа снаружи контейнера уже не вправе ни очистить, ни перезаписать.
      - name: Reclaim workspace ownership
        if: ${{ vars.CI_RUNNER }}
        run: |
          docker run --rm --volume "$GITHUB_WORKSPACE:/workspace" busybox:stable \
            chown -R "$(id -u):$(id -g)" /workspace

      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
