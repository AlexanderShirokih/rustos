name: CI

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          components: rustfmt
          cache: false
      - run: cargo fmt --all --check

  check-layers:
    name: check-layers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
      - run: cargo xtask check-layers

  clippy-host:
    name: clippy (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          components: clippy
      - run: cargo clippy --workspace --exclude drivers-aarch64 --exclude hal-aarch64 --exclude main

  clippy-aarch64:
    name: clippy (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          components: clippy
          target: aarch64-unknown-none
          cache-shared-key: aarch64
      - run: cargo clippy --workspace --exclude xtask --exclude userland-img --target aarch64-unknown-none

  test:
    name: tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
      - run: cargo test --workspace --exclude drivers-aarch64 --exclude hal-aarch64 --exclude main

  qemu-test:
    name: qemu-test (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          target: aarch64-unknown-none
          components: llvm-tools-preview, rust-src
          cache-shared-key: aarch64
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-binutils
      - run: sudo apt-get install -y --no-install-recommends qemu-system-arm
      - run: cargo xtask qemu-test
