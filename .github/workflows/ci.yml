name: CI

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Образ с зафиксированным toolchain + qemu + cargo-binutils/cargo-fuzz собирается отдельным
# workflow (.github/workflows/ci-image.yml) и публикуется в GHCR как public —
# поэтому pull анонимный, credentials/packages-права не нужны.

# Наименьшие привилегии для GITHUB_TOKEN: джобам нужен только checkout.
# Явный read-only нужен на случай, если дефолт Actions в репозитории — read/write
# (джобы гоняют PR-код и сторонние actions). packages-доступ не требуется —
# образ public и тянется анонимно.
permissions:
  contents: read

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    container: ghcr.io/alexandershirokih/molecular-ci:latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --all --check

  check-layers:
    name: check-layers
    runs-on: ubuntu-latest
    container: ghcr.io/alexandershirokih/molecular-ci:latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask check-layers

  style:
    name: style
    runs-on: ubuntu-latest
    container: ghcr.io/alexandershirokih/molecular-ci:latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Проверка перечисляет файлы через git, а checkout внутри контейнера
      # оставляет каталог с чужим владельцем.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask style --all
      # Снапшот принятых нарушений сокращается по каждому действующему правилу.
      # Правило, заведённое этим же изменением, приносит свой долг однократно.
      - name: baseline does not grow
        run: |
          git show "origin/${GITHUB_BASE_REF:-main}:style-baseline.txt" \
            | cut -d'|' -f1 | sort | uniq -c > /tmp/baseline-base
          cut -d'|' -f1 style-baseline.txt | sort | uniq -c > /tmp/baseline-head
          awk 'NR==FNR { was[$2] = $1; next }
               ($2 in was) && $1 > was[$2] {
                 printf "%s: %d accepted violations, was %d\n", $2, $1, was[$2]
                 failed = 1
               }
               END { exit failed }' /tmp/baseline-base /tmp/baseline-head

  clippy-host:
    name: clippy (host)
    runs-on: ubuntu-latest
    container: ghcr.io/alexandershirokih/molecular-ci:latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: host
      - run: cargo clippy --workspace --exclude drivers-aarch64 --exclude hal-aarch64 --all-targets --all-features -- -D warnings

  clippy-aarch64:
    name: clippy (aarch64)
    runs-on: ubuntu-latest
    container: ghcr.io/alexandershirokih/molecular-ci:latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: aarch64
      - run: cargo clippy --workspace --exclude xtask --exclude ipc-test --exclude userland-build --exclude style-tool --target aarch64-unknown-none -- -D warnings

  test:
    name: tests (host)
    runs-on: ubuntu-latest
    container: ghcr.io/alexandershirokih/molecular-ci:latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: host
      - run: cargo test --workspace --exclude drivers-aarch64 --exclude hal-aarch64 --all-features

  race:
    name: race (ThreadSanitizer)
    runs-on: ubuntu-latest
    container: ghcr.io/alexandershirokih/molecular-ci:latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: race
      - run: cargo xtask race

  fuzz-build:
    name: fuzz targets (AddressSanitizer)
    runs-on: ubuntu-latest
    container: ghcr.io/alexandershirokih/molecular-ci:latest
    steps:
      - uses: actions/checkout@v5
      - run: >-
          command -v g++ >/dev/null
          || (apt-get update && apt-get install -y --no-install-recommends g++)
      - run: cargo fuzz --version || cargo install cargo-fuzz --locked
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fuzz
      - run: cargo fuzz build --fuzz-dir fuzz

  qemu-test:
    name: qemu-test (aarch64)
    runs-on: ubuntu-latest
    container: ghcr.io/alexandershirokih/molecular-ci:latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: aarch64
      - run: cargo xtask qemu-test
