name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  fmt:
    name: rustfmt
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    container:
      image: ghcr.io/alexandershirokih/molecular-ci:latest
      options: >-
        ${{ vars.CI_RUNNER && format('--volume /usr/local/bin/sccache:/usr/local/bin/sccache:ro
        --volume /var/cache/ci/sccache:/sccache
        --volume /var/cache/ci/target/{0}:/target
        --env RUSTC_WRAPPER=/usr/local/bin/sccache
        --env SCCACHE_DIR=/sccache
        --env SCCACHE_CACHE_SIZE=20G
        --env CARGO_TARGET_DIR=/target', github.job) || '' }}
    steps:
      - uses: actions/checkout@v5
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --all --check
      - run: cargo fmt --manifest-path lib/std-rt/Cargo.toml --all --check
      - run: cargo fmt --manifest-path user/Cargo.toml --all --check

  check-layers:
    name: check-layers
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    container:
      image: ghcr.io/alexandershirokih/molecular-ci:latest
      options: >-
        ${{ vars.CI_RUNNER && format('--volume /usr/local/bin/sccache:/usr/local/bin/sccache:ro
        --volume /var/cache/ci/sccache:/sccache
        --volume /var/cache/ci/target/{0}:/target
        --env RUSTC_WRAPPER=/usr/local/bin/sccache
        --env SCCACHE_DIR=/sccache
        --env SCCACHE_CACHE_SIZE=20G
        --env CARGO_TARGET_DIR=/target', github.job) || '' }}
    steps:
      - uses: actions/checkout@v5
      - run: cargo xtask check-layers

  doc:
    name: doc links
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    container:
      image: ghcr.io/alexandershirokih/molecular-ci:latest
      options: >-
        ${{ vars.CI_RUNNER && format('--volume /usr/local/bin/sccache:/usr/local/bin/sccache:ro
        --volume /var/cache/ci/sccache:/sccache
        --volume /var/cache/ci/target/{0}:/target
        --env RUSTC_WRAPPER=/usr/local/bin/sccache
        --env SCCACHE_DIR=/sccache
        --env SCCACHE_CACHE_SIZE=20G
        --env CARGO_TARGET_DIR=/target', github.job) || '' }}
    env:
      RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links -D warnings
    steps:
      - uses: actions/checkout@v5
      - run: cargo doc --no-deps --workspace
      - run: cargo xtask userland doc --no-deps --workspace

  style:
    name: style
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    container:
      image: ghcr.io/alexandershirokih/molecular-ci:latest
      options: >-
        ${{ vars.CI_RUNNER && format('--volume /usr/local/bin/sccache:/usr/local/bin/sccache:ro
        --volume /var/cache/ci/sccache:/sccache
        --volume /var/cache/ci/target/{0}:/target
        --env RUSTC_WRAPPER=/usr/local/bin/sccache
        --env SCCACHE_DIR=/sccache
        --env SCCACHE_CACHE_SIZE=20G
        --env CARGO_TARGET_DIR=/target', github.job) || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: cargo xtask style --all
      - name: baseline does not grow
        run: |
          git show "origin/${GITHUB_BASE_REF:-main}:style-baseline.txt" \
            | cut -d'|' -f1 | sort | uniq -c > /tmp/baseline-base
          cut -d'|' -f1 style-baseline.txt | sort | uniq -c > /tmp/baseline-head
          awk 'NR==FNR { was[$2] = $1; next }
               ($2 in was) && $1 > was[$2] {
                 printf "%s: %d accepted violations, was %d\n", $2, $1, was[$2]
                 failed = 1
               }
               END { exit failed }' /tmp/baseline-base /tmp/baseline-head

  clippy-host:
    name: clippy (host)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    container:
      image: ghcr.io/alexandershirokih/molecular-ci:latest
      options: >-
        ${{ vars.CI_RUNNER && format('--volume /usr/local/bin/sccache:/usr/local/bin/sccache:ro
        --volume /var/cache/ci/sccache:/sccache
        --volume /var/cache/ci/target/{0}:/target
        --env RUSTC_WRAPPER=/usr/local/bin/sccache
        --env SCCACHE_DIR=/sccache
        --env SCCACHE_CACHE_SIZE=20G
        --env CARGO_TARGET_DIR=/target', github.job) || '' }}
    steps:
      - uses: actions/checkout@v5
      - run: cargo clippy --workspace --exclude drivers-aarch64 --exclude hal-aarch64 --all-targets --all-features -- -D warnings
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings

  clippy-aarch64:
    name: clippy (aarch64)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    container:
      image: ghcr.io/alexandershirokih/molecular-ci:latest
      options: >-
        ${{ vars.CI_RUNNER && format('--volume /usr/local/bin/sccache:/usr/local/bin/sccache:ro
        --volume /var/cache/ci/sccache:/sccache
        --volume /var/cache/ci/target/{0}:/target
        --env RUSTC_WRAPPER=/usr/local/bin/sccache
        --env SCCACHE_DIR=/sccache
        --env SCCACHE_CACHE_SIZE=20G
        --env CARGO_TARGET_DIR=/target', github.job) || '' }}
    steps:
      - uses: actions/checkout@v5
      - run: cargo clippy --workspace --exclude xtask --exclude ipc-test --exclude userland-build --exclude style-tool --exclude userland-image-tool --target aarch64-unknown-none -- -D warnings
      - run: cargo xtask userland clippy --workspace --all-targets -- -D warnings
      - run: >-
          cargo clippy --manifest-path lib/std-rt/Cargo.toml
          --target targets/aarch64-unknown-molecular.json
          -Zbuild-std=core,alloc -Zjson-target-spec -- -D warnings

  test:
    name: tests (host)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    container:
      image: ghcr.io/alexandershirokih/molecular-ci:latest
      options: >-
        ${{ vars.CI_RUNNER && format('--volume /usr/local/bin/sccache:/usr/local/bin/sccache:ro
        --volume /var/cache/ci/sccache:/sccache
        --volume /var/cache/ci/target/{0}:/target
        --env RUSTC_WRAPPER=/usr/local/bin/sccache
        --env SCCACHE_DIR=/sccache
        --env SCCACHE_CACHE_SIZE=20G
        --env CARGO_TARGET_DIR=/target', github.job) || '' }}
    steps:
      - uses: actions/checkout@v5
      - run: cargo test --workspace --exclude drivers-aarch64 --exclude hal-aarch64 --all-features

  race:
    name: race (ThreadSanitizer)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    container:
      image: ghcr.io/alexandershirokih/molecular-ci:latest
      # ThreadSanitizer раскладывает теневую память по фиксированным адресам и снимает ASLR
      # вызовом personality(), который профиль seccomp по умолчанию запрещает.
      options: >-
        --security-opt seccomp=unconfined
        ${{ vars.CI_RUNNER && format('--volume /usr/local/bin/sccache:/usr/local/bin/sccache:ro
        --volume /var/cache/ci/sccache:/sccache
        --volume /var/cache/ci/target/{0}:/target
        --env RUSTC_WRAPPER=/usr/local/bin/sccache
        --env SCCACHE_DIR=/sccache
        --env SCCACHE_CACHE_SIZE=20G
        --env CARGO_TARGET_DIR=/target', github.job) || '' }}
    steps:
      - uses: actions/checkout@v5
      - run: cargo xtask race

  fuzz-build:
    name: fuzz targets (AddressSanitizer)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    container:
      image: ghcr.io/alexandershirokih/molecular-ci:latest
      options: >-
        ${{ vars.CI_RUNNER && format('--volume /usr/local/bin/sccache:/usr/local/bin/sccache:ro
        --volume /var/cache/ci/sccache:/sccache
        --volume /var/cache/ci/target/{0}:/target
        --env RUSTC_WRAPPER=/usr/local/bin/sccache
        --env SCCACHE_DIR=/sccache
        --env SCCACHE_CACHE_SIZE=20G
        --env CARGO_TARGET_DIR=/target', github.job) || '' }}
    steps:
      - uses: actions/checkout@v5
      - run: >-
          command -v g++ >/dev/null
          || (apt-get update && apt-get install -y --no-install-recommends g++)
      - run: cargo fuzz --version || cargo install cargo-fuzz --locked
      - run: cargo fuzz build --fuzz-dir fuzz

  qemu-test:
    name: qemu-test (aarch64)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    container:
      image: ghcr.io/alexandershirokih/molecular-ci:latest
      options: >-
        ${{ vars.CI_RUNNER && format('--volume /usr/local/bin/sccache:/usr/local/bin/sccache:ro
        --volume /var/cache/ci/sccache:/sccache
        --volume /var/cache/ci/target/{0}:/target
        --env RUSTC_WRAPPER=/usr/local/bin/sccache
        --env SCCACHE_DIR=/sccache
        --env SCCACHE_CACHE_SIZE=20G
        --env CARGO_TARGET_DIR=/target', github.job) || '' }}
    steps:
      - uses: actions/checkout@v5
      - run: cargo xtask qemu-test
