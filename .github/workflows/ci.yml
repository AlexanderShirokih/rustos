name: CI

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Образ с зафиксированным toolchain + qemu + cargo-binutils собирается отдельным
# workflow (.github/workflows/ci-image.yml) и публикуется в GHCR как public —
# поэтому pull анонимный, credentials/packages-права не нужны.

# Наименьшие привилегии для GITHUB_TOKEN: джобам нужен только checkout.
# Явный read-only нужен на случай, если дефолт Actions в репозитории — read/write
# (джобы гоняют PR-код и сторонние actions). packages-доступ не требуется —
# образ public и тянется анонимно.
permissions:
  contents: read

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    container: ghcr.io/alexandershirokih/molecular-ci:latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo fmt --all --check

  check-layers:
    name: check-layers
    runs-on: ubuntu-latest
    container: ghcr.io/alexandershirokih/molecular-ci:latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask check-layers

  clippy-host:
    name: clippy (host)
    runs-on: ubuntu-latest
    container: ghcr.io/alexandershirokih/molecular-ci:latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: host
      - run: cargo clippy --workspace --exclude drivers-aarch64 --exclude hal-aarch64 --exclude main

  clippy-aarch64:
    name: clippy (aarch64)
    runs-on: ubuntu-latest
    container: ghcr.io/alexandershirokih/molecular-ci:latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: aarch64
      - run: cargo clippy --workspace --exclude xtask --exclude ipc-test --exclude userland-build --target aarch64-unknown-none

  test:
    name: tests (host)
    runs-on: ubuntu-latest
    container: ghcr.io/alexandershirokih/molecular-ci:latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: host
      - run: cargo test --workspace --exclude drivers-aarch64 --exclude hal-aarch64 --exclude main

  qemu-test:
    name: qemu-test (aarch64)
    runs-on: ubuntu-latest
    container: ghcr.io/alexandershirokih/molecular-ci:latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: aarch64
      - run: cargo xtask qemu-test
