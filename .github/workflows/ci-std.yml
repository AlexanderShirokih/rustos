name: CI std

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths:
      - patches/std-molecular.patch
      - xtask/src/std_src.rs
      - rust-toolchain.toml
      - targets/aarch64-unknown-molecular.json
      - lib/std-rt/**
      - lib/component-abi/**
      - lib/ipc/**
      - lib/log-abi/**
      - lib/syscall/**
      - user/hello-std/**
      - user/Cargo.toml
      - user/.cargo/config.toml
      - .github/workflows/ci-std.yml

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  std:
    name: std (aarch64-unknown-molecular)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    container:
      image: ghcr.io/alexandershirokih/molecular-ci:latest
      options: >-
        ${{ vars.CI_RUNNER && format('--volume /usr/local/bin/sccache:/usr/local/bin/sccache:ro
        --volume /var/cache/ci/sccache:/sccache
        --volume /var/cache/ci/target/{0}:/target
        --env RUSTC_WRAPPER=/usr/local/bin/sccache
        --env SCCACHE_DIR=/sccache
        --env SCCACHE_CACHE_SIZE=20G
        --env CARGO_TARGET_DIR=/target', github.job) || '' }}
    steps:
      - uses: actions/checkout@v5
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: cargo xtask std-src --verify
