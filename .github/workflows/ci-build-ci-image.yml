name: CI image

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - Dockerfile
      - rust-toolchain.toml
      - similarity.toml
      - .github/workflows/ci-build-ci-image.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - rust-toolchain.toml
      - similarity.toml
      - .github/workflows/ci-build-ci-image.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}-ci

jobs:
  build:
    name: build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.reference.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      # Имя репозитория несёт заглавные буквы, а ссылка на образ их не принимает.
      - id: reference
        run: echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: ${{ github.event_name != 'pull_request' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: type=sha

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify:
    name: verify
    needs: build
    if: ${{ github.event_name != 'pull_request' }}
    uses: ./.github/workflows/ci-container-job.yml
    with:
      image: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
      cache-scope: verify
      timeout-minutes: 20
      # Первая часть: образ несёт инструменты, которые обещает. Вторая: собранным
      # инструментом проходит проверка.
      run: |
        rustc --version
        cargo fmt --version
        cargo clippy --version
        cargo objcopy --version
        cargo fuzz --version
        sccache --version
        similarity-rs --version
        qemu-system-aarch64 --version
        cargo xtask check-layers

  promote:
    name: promote latest
    needs: [build, verify]
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          REFERENCE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: docker buildx imagetools create --tag "$REFERENCE:latest" "$REFERENCE@$DIGEST"
