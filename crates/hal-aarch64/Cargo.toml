[package]
name = "hal-aarch64"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "kernel-aarch64"
path = "src/start.rs"
test = false

[features]
default = ["boot-linux-arm64"]
boot-linux-arm64 = []
boot-uefi = []
qemu-tests = [
    "kernelspace/qemu-tests",
    "dep:test-harness-qemu",
    "dep:test-harness-qemu-aarch64",
]

[dependencies]
hal-aarch64-asid = { workspace = true }
hal-aarch64-paging = { workspace = true }
hal-common = { workspace = true }
drivers-common-aarch64 = { workspace = true }
drivers-common = { workspace = true }
drivers-aarch64 = { workspace = true }
kernelspace = { workspace = true }
kobject = { workspace = true }
scheduler = { workspace = true }
syscall = { workspace = true }
memory = { workspace = true }
userspace = { workspace = true }
collections = { workspace = true }
fdt = { workspace = true }
io = { workspace = true }
klog = { workspace = true }
spin = { workspace = true }
test-harness-qemu = { workspace = true, optional = true }
test-harness-qemu-aarch64 = { workspace = true, optional = true }

[build-dependencies]
serde = { workspace = true }
serde_yaml = { workspace = true }

[lints]
workspace = true
