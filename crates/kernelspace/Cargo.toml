[package]
name = "kernelspace"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
# Под этим флагом kmain после bootstrap'а зовёт `kernel_tests::run_all_tests()`
# из init-таска и завершает QEMU через ARM semihosting.
qemu-tests = [
    "dep:test-harness-qemu",
]

[dependencies]
spin = { workspace = true }
collections = { workspace = true }
drivers-common = { workspace = true }
io = { workspace = true }
kobject = { workspace = true }
memory = { workspace = true }
klog = { workspace = true }
scheduler = { workspace = true }
syscall = { workspace = true }
userspace = { workspace = true }
test-harness-qemu = { workspace = true, optional = true }

[lints]
workspace = true
