stages:
  - check
  - test
  - build

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
  CARGO_TERM_COLOR: always


default:
  image: rust:latest
  before_script:
    - rustup show

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cargo/registry
    - .cargo/git
    - target/

fmt:
  stage: check
  script:
    - cargo fmt --all --check

check-layers:
  stage: check
  script:
    - cargo xtask check-layers

clippy:host:
  stage: check
  script:
    - cargo clippy --workspace --exclude drivers-aarch64 --exclude hal-aarch64 --exclude main

clippy:aarch64:
  stage: check
  script:
    - cargo clippy --workspace --exclude xtask --exclude userland-img --target aarch64-unknown-none

test:
  stage: test
  script:
    - cargo test --workspace --exclude drivers-aarch64 --exclude hal-aarch64 --exclude main

build:qemu:
  stage: build
  script:
    - cargo xtask build devices/spec/qemu-aarch64.yaml
