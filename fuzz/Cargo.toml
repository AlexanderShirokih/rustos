[package]
name = "mobile-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
fdt = { path = "../lib/fdt" }
filesystem = { path = "../lib/filesystem" }
filesystem-abi = { path = "../lib/filesystem-abi" }
ipc = { path = "../lib/ipc" }
libfuzzer-sys = "0.4"
userland = { path = "../lib/userland" }
userland-image = { path = "../lib/userland-image" }

[lints]
workspace = true

[[bin]]
name = "fdt_parse_walk"
path = "fuzz_targets/fdt_parse_walk.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ramfs_ops"
path = "fuzz_targets/ramfs_ops.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ipc_wire_decode"
path = "fuzz_targets/ipc_wire_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "userland_image_decode"
path = "fuzz_targets/userland_image_decode.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

# Таблица повторяет корневую дословно, комментарии к отдельным правилам лежат там же.
# Расхождение ловит `xtask/tests/lint_policy.rs`.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unsafe_code = "deny"
# Имя таргета Molecular OS задаёт спека в `targets/`, встроенным rustc его не знает: хостовая
# сборка иначе ругается на `target_os` из кода, общего с userspace.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("molecular"))'] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_docs_in_private_items = "allow"
doc_markdown = "allow"
inline_always = "allow"
return_self_not_must_use = "allow"
undocumented_unsafe_blocks = "warn"
unwrap_used = "deny"
cast_possible_truncation = "allow"
cast_sign_loss = "warn"
cast_lossless = "warn"
