[package]
license = "MIT"
name = "mobile-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
component-abi = { path = "../lib/component-abi" }
fdt = { path = "../lib/fdt" }
filesystem = { path = "../lib/filesystem" }
filesystem-abi = { path = "../lib/filesystem-abi" }
ipc = { path = "../lib/ipc" }
libfuzzer-sys = "0.4"
syscall = { path = "../lib/syscall" }
userland = { path = "../lib/userland" }
userland-image = { path = "../lib/userland-image" }

[lints]
workspace = true

[[bin]]
name = "fdt_parse_walk"
path = "fuzz_targets/fdt_parse_walk.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ramfs_ops"
path = "fuzz_targets/ramfs_ops.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ipc_wire_decode"
path = "fuzz_targets/ipc_wire_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "userland_image_decode"
path = "fuzz_targets/userland_image_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "syscall_arg_decode"
path = "fuzz_targets/syscall_arg_decode.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[workspace.metadata.molecular]
profile = "fuzz"

# Таблица повторяет корневую дословно, комментарии к отдельным правилам лежат там же.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unsafe_code = "deny"
unreachable_pub = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("molecular"))'] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_docs_in_private_items = "allow"
doc_markdown = "allow"
inline_always = "allow"
return_self_not_must_use = "allow"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "deny"
unwrap_used = "deny"
unwrap_in_result = "deny"
expect_used = "deny"
indexing_slicing = "deny"
missing_asserts_for_indexing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
std_instead_of_core = "deny"
cast_sign_loss = "warn"
cast_lossless = "warn"
