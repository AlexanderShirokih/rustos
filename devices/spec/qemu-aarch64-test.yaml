device:
  name: QEMU AArch64 (kernel test mode)
  arch: aarch64

boot:
  format: linux_arm64
  offset: 0x40200000

features: [power-semihosting]

run:
  - "qemu-system-aarch64 -machine virt,gic-version=3 -cpu cortex-a53 -m 512M -nographic -no-reboot -nic none -semihosting -kernel target/build/kernel.bin -initrd target/build/userland.img"

debug:
  - "qemu-system-aarch64 -machine virt,gic-version=3 -cpu cortex-a53 -m 512M -nographic -no-reboot -nic none -semihosting -kernel target/build/kernel.bin -initrd target/build/userland.img -S -gdb tcp::1234"
