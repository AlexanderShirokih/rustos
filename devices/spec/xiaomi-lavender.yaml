device:
  name: Xiaomi Redmi Note 7
  arch: aarch64

boot:
  # Базовое дерево собрано из `arch/arm64/boot/dts/qcom/sdm660-xiaomi-lavender.dts`
  # Linux v6.16 командой `clang -E -P -nostdinc -undef -D__DTS__ -x assembler-with-cpp
  # -I include -I arch/arm64/boot/dts/qcom <dts> | dtc -@ -I dts -O dtb`. Таблица
  # `__symbols__` даёт оверлею метки узлов.
  dtb: /devices/dtb/sdm660-lavender.dtb
  dtb_overlay: /devices/dtb/sdm660-lavender.dtso
  format: android_boot_v1
  offset: 0x40080000
  base: 0x40000000
  ext:
    # ABL распаковывает ядро по смещению 0x80000 от начала boot.img, ramdisk
    # в файле кладётся за концом распакованного ядра.
    kernel_image_pad: 0x80000

run: [
  "fastboot boot target/build/boot.img"
]