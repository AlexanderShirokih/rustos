[workspace]
resolver = "3"
members = [
    "kernel/drivers-common",
    "kernel/drivers-common-aarch64",
    "kernel/hal-aarch64-asid",
    "kernel/hal-aarch64-paging",
    "kernel/hal-common",
    "lib/bootstrap-abi",
    "lib/display-abi",
    "lib/input-abi",
    "lib/io",
    "lib/ipc",
    "lib/kernel-objects",
    "lib/log-abi",
    "lib/platform-abi",
    "lib/program-entry",
    "lib/rtc-abi",
    "lib/syscall",
    "kernel/kernelspace",
    "kernel/capability",
    "kernel/base",
    "kernel/log",
    "kernel/memory",
    "kernel/process",
    "kernel/scheduler",
    "kernel/syscall",
    "lib/test-harness-macros",
    "lib/test-harness",
    "lib/component-abi",
    "lib/device-resolver",
    "lib/fdt",
    "lib/fdt-test",
    "lib/filesystem",
    "lib/filesystem-abi",
    "lib/filesystem-client",
    "lib/spmi-abi",
    "lib/userland",
    "lib/userland-image",
    "lib/virtio",
    "lib/virtio-mmio-abi",
]
# `lib/ipc-test` и `lib/syscall-user` лежат внутри каталога корня, но принадлежат другим workspace.
exclude = [
    "fuzz",
    "kernel/platform",
    "lib/ipc-test",
    "lib/std-runtime",
    "lib/syscall-user",
    "tools",
    "user",
]

[workspace.metadata.molecular]
profile = "common"

[[workspace.metadata.molecular.arch]]
name = "aarch64"
bare = "aarch64-unknown-none"
system = "targets/aarch64-unknown-molecular.json"

[workspace.package]
license = "MIT"
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# Внешние зависимости
spin = "0.12.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
flate2 = "1.0"
crc32fast = "1.5"
object = "0.39.1"
toml = "1.1.2"
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
ra_ap_syntax = "=0.0.344"
regex = "1"
sha2 = "0.10"
tempfile = "3"
trybuild = "1.0"

# Внутренние крейты workspace
ipc = { path = "lib/ipc" }
ipc-test = { path = "lib/ipc-test" }
bootstrap-abi = { path = "lib/bootstrap-abi" }
display-abi = { path = "lib/display-abi" }
input-abi = { path = "lib/input-abi" }
log-abi = { path = "lib/log-abi" }
platform-abi = { path = "lib/platform-abi" }
component-abi = { path = "lib/component-abi" }
device-resolver = { path = "lib/device-resolver" }
io = { path = "lib/io" }
kbase = { path = "kernel/base" }
klog = { path = "kernel/log" }
fdt = { path = "lib/fdt" }
fdt-test = { path = "lib/fdt-test" }
filesystem = { path = "lib/filesystem" }
filesystem-abi = { path = "lib/filesystem-abi" }
filesystem-client = { path = "lib/filesystem-client" }
kernel-objects = { path = "lib/kernel-objects" }
memory = { path = "kernel/memory" }
hal-common = { path = "kernel/hal-common" }
hal-aarch64-asid = { path = "kernel/hal-aarch64-asid" }
hal-aarch64-paging = { path = "kernel/hal-aarch64-paging" }
drivers-common = { path = "kernel/drivers-common" }
drivers-common-aarch64 = { path = "kernel/drivers-common-aarch64" }
kernelspace = { path = "kernel/kernelspace" }
capability = { path = "kernel/capability" }
scheduler = { path = "kernel/scheduler" }
syscall = { path = "lib/syscall" }
syscall-kernel = { path = "kernel/syscall" }
syscall-user = { path = "lib/syscall-user" }
test-harness = { path = "lib/test-harness" }
test-harness-macros = { path = "lib/test-harness-macros" }
program-entry = { path = "lib/program-entry" }
userland = { path = "lib/userland" }
userland-build = { path = "lib/userland-build" }
userland-image = { path = "lib/userland-image" }
rtc-abi = { path = "lib/rtc-abi" }
spmi-abi = { path = "lib/spmi-abi" }
virtio-mmio-abi = { path = "lib/virtio-mmio-abi" }
process = { path = "kernel/process" }
userland-image-tool = { path = "tools/userland-image" }
style-tool = { path = "tools/style" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# Архитектурно-независимый код не должен использовать `unsafe`.
unsafe_code = "deny"
unreachable_pub = "warn"
# Имя `molecular` в `target_os` задаёт спека таргета в `targets/`, встроенным rustc его не знает:
# хостовая сборка иначе ругается на `target_os` из кода, общего с userspace.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("molecular"))'] }

[workspace.lints.clippy]
# Группы линтов
pedantic = { level = "warn", priority = -1 }
# Отключаем шумные pedantic-линты, не подходящие для bare-metal ядра
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_docs_in_private_items = "allow"
doc_markdown = "allow"
inline_always = "allow"
return_self_not_must_use = "allow"
# Ядерные unsafe-линты
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "deny"
# Операции, паникующие на неверном значении, запрещены рабочему коду. Тестовый код выведен
# из-под запрета.
unwrap_used = "deny"
unwrap_in_result = "deny"
expect_used = "deny"
indexing_slicing = "deny"
missing_asserts_for_indexing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
# Крейты `no_std`: обращение к `std` там - отклонение, хостовые инструменты снимают запрет
# в корне крейта.
std_instead_of_core = "deny"
# Качество кода
cast_sign_loss = "warn"
cast_lossless = "warn"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = true
opt-level = 2
