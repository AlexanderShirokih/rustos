[workspace]
resolver = "3"
members = [
    "arch/aarch64",
    "arch/common",
    "core",
    "memory",
    "util",
]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = true  # Включить отладочные символы даже для release сборки
opt-level = 2  # Оптимизация с сохранением возможности отладки
