[workspace]
resolver = "3"
members = [
    "arch/aarch64",
    "arch/aarch64-paging",
    "arch/common",
    "collections",
    "drivers/common-aarch64",
    "drivers/common",
    "drivers/aarch64",
    "kernel",
    "fdt",
    "io",
    "log",
    "memory",
    "qemu-test-harness",
    "qemu-test-harness-aarch64",
    "util",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# Внешние зависимости
spin = "0.10.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
flate2 = "1.0"

# Внутренние крейты workspace
collections = { path = "collections" }
io = { path = "io" }
klog = { path = "log" }
fdt = { path = "fdt" }
memory = { path = "memory" }
util = { path = "util" }
arch-common = { path = "arch/common" }
aarch64-paging = { path = "arch/aarch64-paging" }
drivers-common = { path = "drivers/common" }
drivers-common-aarch64 = { path = "drivers/common-aarch64" }
drivers-aarch64 = { path = "drivers/aarch64" }
kernel = { path = "kernel" }
qemu-test-harness = { path = "qemu-test-harness" }
qemu-test-harness-aarch64 = { path = "qemu-test-harness-aarch64" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# Группы линтов
pedantic = { level = "warn", priority = -1 }
# Отключаем шумные pedantic-линты, не подходящие для bare-metal ядра
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_docs_in_private_items = "allow"
doc_markdown = "allow"
inline_always = "allow"
return_self_not_must_use = "allow"
# Ядерные unsafe-линты
undocumented_unsafe_blocks = "warn"
# Качество кода
cast_possible_truncation = "allow"
cast_sign_loss = "warn"
cast_lossless = "warn"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = true
opt-level = 2
