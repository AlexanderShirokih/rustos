[workspace]
resolver = "3"
members = [
    "abi/userland-abi",
    "kernel/drivers-aarch64",
    "kernel/drivers-common",
    "kernel/drivers-common-aarch64",
    "kernel/fdt",
    "kernel/hal-aarch64",
    "kernel/hal-aarch64-asid",
    "kernel/hal-aarch64-paging",
    "kernel/hal-common",
    "lib/io",
    "kernel/kernelspace",
    "kernel/kobject",
    "kernel/log",
    "kernel/memory",
    "kernel/process",
    "kernel/scheduler",
    "kernel/syscall",
    "lib/test-harness-macros",
    "lib/test-harness-qemu",
    "lib/collections",
    "lib/util",
    "tools/userland-img",
    "user/rootkeeper",
    "user/rt",
    "user/testrunner",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# Внешние зависимости
spin = "0.10.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
flate2 = "1.0"
crc32fast = "1.5"
object = "0.37"
toml = "0.9"
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }

# Внутренние крейты workspace
collections = { path = "lib/collections" }
io = { path = "lib/io" }
klog = { path = "kernel/log" }
fdt = { path = "kernel/fdt" }
memory = { path = "kernel/memory" }
util = { path = "lib/util" }
hal-common = { path = "kernel/hal-common" }
hal-aarch64-asid = { path = "kernel/hal-aarch64-asid" }
hal-aarch64-paging = { path = "kernel/hal-aarch64-paging" }
drivers-common = { path = "kernel/drivers-common" }
drivers-common-aarch64 = { path = "kernel/drivers-common-aarch64" }
drivers-aarch64 = { path = "kernel/drivers-aarch64" }
kernelspace = { path = "kernel/kernelspace" }
kobject = { path = "kernel/kobject" }
scheduler = { path = "kernel/scheduler" }
syscall = { path = "kernel/syscall" }
test-harness-qemu = { path = "lib/test-harness-qemu" }
test-harness-macros = { path = "lib/test-harness-macros" }
userland-abi = { path = "abi/userland-abi" }
userland-rt = { path = "user/rt" }
process = { path = "kernel/process" }
userland-img = { path = "tools/userland-img" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# Архитектурно-независимый код не должен использовать `unsafe`. Платформенные
# крейты (arch-*, drivers-*-aarch64) и низкоуровневые
# ядерные примитивы (memory, kernelspace, io, collections, fdt, ...) явно опциируются
# через `#![allow(unsafe_code)]` в корне крейта - это видно в diff.
unsafe_code = "deny"

[workspace.lints.clippy]
# Группы линтов
pedantic = { level = "warn", priority = -1 }
# Отключаем шумные pedantic-линты, не подходящие для bare-metal ядра
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_docs_in_private_items = "allow"
doc_markdown = "allow"
inline_always = "allow"
return_self_not_must_use = "allow"
# Ядерные unsafe-линты
undocumented_unsafe_blocks = "warn"
# Качество кода
cast_possible_truncation = "allow"
cast_sign_loss = "warn"
cast_lossless = "warn"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = true
opt-level = 2
