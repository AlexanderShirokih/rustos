[workspace]
resolver = "3"
members = [
    "crates/hal-aarch64",
    "crates/hal-aarch64-asid",
    "crates/hal-aarch64-paging",
    "crates/hal-common",
    "crates/collections",
    "crates/drivers-common-aarch64",
    "crates/drivers-common",
    "crates/drivers-aarch64",
    "crates/kernelspace",
    "crates/kobject",
    "crates/scheduler",
    "crates/syscall",
    "crates/fdt",
    "crates/io",
    "crates/log",
    "crates/memory",
    "crates/test-harness-qemu",
    "crates/test-harness-qemu-aarch64",
    "crates/userspace",
    "crates/util",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# Внешние зависимости
spin = "0.10.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
flate2 = "1.0"

# Внутренние крейты workspace
collections = { path = "crates/collections" }
io = { path = "crates/io" }
klog = { path = "crates/log" }
fdt = { path = "crates/fdt" }
memory = { path = "crates/memory" }
util = { path = "crates/util" }
hal-common = { path = "crates/hal-common" }
hal-aarch64-asid = { path = "crates/hal-aarch64-asid" }
hal-aarch64-paging = { path = "crates/hal-aarch64-paging" }
drivers-common = { path = "crates/drivers-common" }
drivers-common-aarch64 = { path = "crates/drivers-common-aarch64" }
drivers-aarch64 = { path = "crates/drivers-aarch64" }
kernelspace = { path = "crates/kernelspace" }
kobject = { path = "crates/kobject" }
scheduler = { path = "crates/scheduler" }
syscall = { path = "crates/syscall" }
test-harness-qemu = { path = "crates/test-harness-qemu" }
test-harness-qemu-aarch64 = { path = "crates/test-harness-qemu-aarch64" }
userspace = { path = "crates/userspace" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# Архитектурно-независимый код не должен использовать `unsafe`. Платформенные
# крейты (arch-*, drivers-*-aarch64, test-harness-qemu-aarch64) и низкоуровневые
# ядерные примитивы (memory, kernelspace, io, collections, fdt, ...) явно опциируются
# через `#![allow(unsafe_code)]` в корне крейта - это видно в diff.
unsafe_code = "deny"

[workspace.lints.clippy]
# Группы линтов
pedantic = { level = "warn", priority = -1 }
# Отключаем шумные pedantic-линты, не подходящие для bare-metal ядра
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_docs_in_private_items = "allow"
doc_markdown = "allow"
inline_always = "allow"
return_self_not_must_use = "allow"
# Ядерные unsafe-линты
undocumented_unsafe_blocks = "warn"
# Качество кода
cast_possible_truncation = "allow"
cast_sign_loss = "warn"
cast_lossless = "warn"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = true
opt-level = 2
