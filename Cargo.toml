[workspace]
resolver = "3"
members = [
    "kernel/drivers-aarch64",
    "kernel/drivers-common",
    "kernel/drivers-common-aarch64",
    "kernel/hal-aarch64",
    "kernel/hal-aarch64-asid",
    "kernel/hal-aarch64-paging",
    "kernel/hal-common",
    "lib/bootstrap-abi",
    "lib/io",
    "lib/ipc",
    "lib/ipc-macros",
    "lib/ipc-schema",
    "lib/ipc-test",
    "lib/syscall",
    "kernel/kernelspace",
    "kernel/capability",
    "kernel/log",
    "kernel/memory",
    "kernel/process",
    "kernel/scheduler",
    "kernel/syscall",
    "lib/test-harness-macros",
    "lib/test-harness-qemu",
    "lib/collections",
    "lib/fdt",
    "lib/userland",
    "lib/userland-build",
    "lib/userland-image",
    "lib/userland-loader",
    "lib/runtime",
    "lib/util",
    "tools/userland-image",
    "user/rootkeeper",
    "user/testrunner",
    "user/calculator-demo",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# Внешние зависимости
spin = "0.12.0"
talc = { version = "4", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
flate2 = "1.0"
crc32fast = "1.5"
object = "0.39.1"
toml = "1.1.2"
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
sha2 = "0.11.0"

# Внутренние крейты workspace
ipc = { path = "lib/ipc" }
ipc-macros = { path = "lib/ipc-macros" }
ipc-schema = { path = "lib/ipc-schema" }
ipc-test = { path = "lib/ipc-test" }
bootstrap = { path = "lib/bootstrap-abi" }
collections = { path = "lib/collections" }
io = { path = "lib/io" }
klog = { path = "kernel/log" }
fdt = { path = "lib/fdt" }
memory = { path = "kernel/memory" }
util = { path = "lib/util" }
hal-common = { path = "kernel/hal-common" }
hal-aarch64-asid = { path = "kernel/hal-aarch64-asid" }
hal-aarch64-paging = { path = "kernel/hal-aarch64-paging" }
drivers-common = { path = "kernel/drivers-common" }
drivers-common-aarch64 = { path = "kernel/drivers-common-aarch64" }
drivers-aarch64 = { path = "kernel/drivers-aarch64" }
kernelspace = { path = "kernel/kernelspace" }
capability = { path = "kernel/capability" }
scheduler = { path = "kernel/scheduler" }
syscall = { path = "lib/syscall" }
syscall-kernel = { path = "kernel/syscall" }
test-harness-qemu = { path = "lib/test-harness-qemu" }
test-harness-macros = { path = "lib/test-harness-macros" }
userland = { path = "lib/userland" }
userland-build = { path = "lib/userland-build" }
userland-image = { path = "lib/userland-image" }
userland-loader = { path = "lib/userland-loader" }
runtime = { path = "lib/runtime" }
process = { path = "kernel/process" }
userland-image-tool = { path = "tools/userland-image" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# Архитектурно-независимый код не должен использовать `unsafe`.
unsafe_code = "deny"

[workspace.lints.clippy]
# Группы линтов
pedantic = { level = "warn", priority = -1 }
# Отключаем шумные pedantic-линты, не подходящие для bare-metal ядра
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_docs_in_private_items = "allow"
doc_markdown = "allow"
inline_always = "allow"
return_self_not_must_use = "allow"
# Ядерные unsafe-линты
undocumented_unsafe_blocks = "warn"
# Качество кода
cast_possible_truncation = "allow"
cast_sign_loss = "warn"
cast_lossless = "warn"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = true
opt-level = 2
