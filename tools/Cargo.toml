[workspace]
resolver = "3"
members = [
    "style",
    "userland-image",
    "../xtask",
    "../lib/userland-build",
    "../lib/ipc-test",
]

[workspace.metadata.molecular]
profile = "host"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# Внешние зависимости
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
flate2 = "1.0"
object = "0.39.1"
toml = "1.1.2"
ra_ap_syntax = "=0.0.344"
regex = "1"
tempfile = "3"

# Крейты этого workspace
userland-image-tool = { path = "userland-image" }
style-tool = { path = "style" }

# Крейты корневого workspace
component-abi = { path = "../lib/component-abi" }
filesystem-abi = { path = "../lib/filesystem-abi" }
ipc = { path = "../lib/ipc" }
syscall = { path = "../lib/syscall" }
userland = { path = "../lib/userland" }
userland-image = { path = "../lib/userland-image" }

# Таблица повторяет корневую дословно, комментарии к отдельным правилам лежат там же.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("molecular"))'] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_docs_in_private_items = "allow"
doc_markdown = "allow"
inline_always = "allow"
return_self_not_must_use = "allow"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "deny"
unwrap_used = "deny"
unwrap_in_result = "deny"
expect_used = "deny"
indexing_slicing = "deny"
missing_asserts_for_indexing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
std_instead_of_core = "deny"
cast_sign_loss = "warn"
cast_lossless = "warn"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = true
opt-level = 2
