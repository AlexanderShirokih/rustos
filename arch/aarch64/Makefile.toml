[tasks.build]
command = "cargo"
args = ["build", "--release"]

[tasks.clean]
command = "cargo"
args = ["clean"]

[tasks.image]
dependencies = ["clean", "build"]
script = [
    "mkdir -p ../../target/build/",
    "cargo objcopy --release -- --set-section-flags .bss=alloc,load,data -O binary ../../target/build/kernel.bin",
]

[tasks.compress]
dependencies = ["image"]
script = [
    "gzip -9c ../../target/build/kernel.bin > ../../target/build/kernel.gz"
]

[tasks.concat]
dependencies = ["compress"]
script = [
    "cat ../../target/build/kernel.gz devices/xiaomi/sdm660-lavender.dtb > ../../target/build/kernel.gz+dtb"
]

[tasks.bootimg]
dependencies = ["concat"]
script = [
    """
    mkbootimg \
        --kernel ../../target/build/kernel.gz+dtb \
        --ramdisk /dev/null \
        --base 0x0 \
        --kernel_offset 0x0 \
        --ramdisk_offset 0x01000000 \
        --pagesize 4096 \
        --header_version 1 \
        --output ../../target/build/boot.img
  """
]

[tasks.boot]
dependencies = ["bootimg"]
script = [
    """
    fastboot boot ../../target/build/boot.img
    """
]

[tasks.qemu-build]
command = "cargo"
args = ["build", "--release", "--features", "qemu_virt"]

[tasks.qemu-image]
dependencies = ["qemu-build"]
script = [
    "mkdir -p ../../target/build/",
    "cargo objcopy --release --features qemu_virt -- -O binary ../../target/build/kernel-qemu.bin"
]

[tasks.qemu-run]
dependencies = ["qemu-image"]
script = [
    """
    qemu-system-aarch64 \
        -machine virt \
        -cpu cortex-a53 \
        -m 512M \
        -nographic -serial mon:stdio \
        -kernel ../../target/build/kernel-qemu.bin
    """
]

[tasks.qemu]
dependencies = ["qemu-run"]

[tasks.qemu-debug]
dependencies = ["qemu-image"]
script = [
    """
    qemu-system-aarch64 \
        -machine virt \
        -cpu cortex-a53 \
        -m 512M \
        -nographic -serial mon:stdio \
        -kernel ../../target/build/kernel-qemu.bin \
        -s -S
    """
]
