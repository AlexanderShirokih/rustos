[tasks.build]
command = "cargo"
args = ["build", "--release", "--target", "aarch64-unknown-none"]

[tasks.clean]
command = "cargo"
args = ["clean"]

[tasks.image]
dependencies = ["clean", "build"]
script = [
    "mkdir -p ../../target/build/",
    "cargo objcopy --release --target aarch64-unknown-none -- --set-section-flags .bss=alloc,load,data -O binary ../../target/build/kernel.bin",
]
