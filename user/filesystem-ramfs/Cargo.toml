cargo-features = ["per-package-target"]

[package]
name = "filesystem-ramfs"
version.workspace = true
edition.workspace = true
publish.workspace = true
build = "build.rs"
forced-target = "aarch64-unknown-none"

[package.metadata.userland]
stack_size = 65536

[[bin]]
name = "filesystem-ramfs"
path = "src/main.rs"
test = false
bench = false

[dependencies]
filesystem = { workspace = true }
filesystem-server = { workspace = true }
runtime = { workspace = true }
syscall = { workspace = true }

[build-dependencies]
userland-build = { workspace = true }

[lints]
workspace = true
