version = 1

[[components]]
executable = "namespace-router"
memory_limit = "8M"
restarts = 2

[[components]]
executable = "filesystem-imagefs"
memory_limit = "4M"
scope = { namespace = "/" }

[[components]]
executable = "filesystem-ramfs"
memory_limit = "4M"
scope = { namespace = "/tmp" }

[[components]]
executable = "driver-pl031"
memory_limit = "1M"
restarts = 2

[[components]]
executable = "calculator"
memory_limit = "1M"
restarts = 2

[[components]]
executable = "demo"
memory_limit = "2M"
restarts = 2
bind = { area = "filesystem-imagefs" }
scope = { area = "/boot/demo" }
