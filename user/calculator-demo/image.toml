version = 1

[plan]
source = "user/calculator-demo/system.toml"

[stage1]
source = "user/calculator-demo/stage1.toml"

[[mount_tables]]
source = "user/calculator-demo/namespace.toml"

[[programs]]
package = "rootkeeper"
path = "/boot/rootkeeper"
boot = true

[[programs]]
package = "driver-pl031"
path = "/boot/driver-pl031"

[[programs]]
package = "namespace-router"
path = "/boot/namespace-router"

[[programs]]
package = "filesystem-imagefs"
path = "/boot/filesystem-imagefs"

[[programs]]
package = "filesystem-ramfs"
path = "/boot/filesystem-ramfs"

[[programs]]
package = "init"
path = "/boot/init"

[[programs]]
package = "calculator-demo"
bin = "calculator"
path = "/boot/calculator"

[[programs]]
package = "calculator-demo"
bin = "demo"
path = "/boot/demo"

[[files]]
path = "/boot/demo/banner"
source = "user/calculator-demo/assets/banner.txt"
