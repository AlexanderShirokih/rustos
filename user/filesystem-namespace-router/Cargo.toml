cargo-features = ["per-package-target"]

[package]
name = "filesystem-namespace-router"
version.workspace = true
edition.workspace = true
publish.workspace = true
build = "build.rs"
forced-target = "aarch64-unknown-none"

[package.metadata.userland]
stack_size = 65536

[[bin]]
name = "filesystem-namespace-router"
path = "src/main.rs"
test = false
bench = false

[dependencies]
filesystem-abi = { workspace = true }
filesystem-server = { workspace = true }
ipc = { workspace = true }
runtime = { workspace = true }
spin = { workspace = true }
syscall = { workspace = true }
userland-image = { workspace = true }
userland-loader = { workspace = true }

[build-dependencies]
userland-build = { workspace = true }

[lints]
workspace = true
