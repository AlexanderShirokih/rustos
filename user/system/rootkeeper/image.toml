version = 1

[plan]
source = "user/system/rootkeeper/system.toml"

[[programs]]
package = "rootkeeper"
path = "/rootkeeper"
boot = true

[[programs]]
package = "platform"
path = "/platform"

[[programs]]
package = "driver-pl031"
path = "/driver-pl031"

[[programs]]
package = "driver-pm8941-rtc"
path = "/driver-pm8941-rtc"

[[programs]]
package = "driver-pm8941-pwrkey"
bin = "driver-pm8941-pwrkey"
path = "/driver-pm8941-pwrkey"

[[programs]]
package = "driver-pm8941-pwrkey"
bin = "driver-pm8941-resin"
path = "/driver-pm8941-resin"

[[programs]]
package = "driver-simplefb"
path = "/driver-simplefb"

[[programs]]
package = "virtio-mmio"
path = "/virtio-mmio"

[[programs]]
package = "spmi-pmic-arb"
path = "/spmi-pmic-arb"

[[programs]]
package = "driver-virtio-gpu"
path = "/driver-virtio-gpu"

[[programs]]
package = "mounts"
path = "/mounts"

[[programs]]
package = "filesystem-imagefs"
path = "/filesystem-imagefs"

[[programs]]
package = "filesystem-ramfs"
path = "/filesystem-ramfs"

[[programs]]
package = "input-hub"
path = "/input-hub"

[[programs]]
package = "driver-virtio-input"
path = "/driver-virtio-input"

[[programs]]
package = "hello-std"
path = "/hello-std"

[[programs]]
package = "hello-c"
path = "/hello-c"

[[programs]]
package = "clock-std"
path = "/clock-std"

[[files]]
path = "/mounts/table"
source = "user/system/rootkeeper/mounts"
