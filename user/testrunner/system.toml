version = 1

[[components]]
executable = "/boot/namespace-router"
memory_limit = "2M"
startup_timeout = "2s"
on_failure = "restart 2 then halt"

[[components]]
executable = "/boot/filesystem-imagefs"
memory_limit = "4M"
startup_timeout = "2s"
on_failure = "halt"

[[components]]
executable = "/boot/unresponsive-filesystem"
memory_limit = "1M"
startup_timeout = "2s"
on_failure = "halt"

[[components]]
executable = "/boot/spare-filesystem"
memory_limit = "4M"
startup_timeout = "2s"
on_failure = "halt"

[[components]]
executable = "/boot/filesystem-consumer-fixture"
memory_limit = "2M"
startup_timeout = "2s"
on_failure = "detach"

[[components]]
executable = "/boot/init"
memory_limit = "2M"
startup_timeout = "2s"
on_failure = "halt"
