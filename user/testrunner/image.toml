version = 1

[plan]
source = "user/testrunner/system.toml"
path = "/boot/testrunner/plan"

[[mount_tables]]
source = "user/testrunner/namespace.toml"

[[programs]]
package = "testrunner"
path = "/boot/testrunner"
boot = true

[[programs]]
package = "testrunner"
bin = "spawn-fixture"
path = "/boot/spawn-fixture"

[[programs]]
package = "testrunner"
bin = "startup-fixture"
path = "/boot/startup-fixture"

[[programs]]
package = "testrunner"
bin = "port-fixture"
path = "/boot/port-fixture"

[[programs]]
package = "testrunner"
bin = "reply-holder"
path = "/boot/reply-holder"

[[programs]]
package = "testrunner"
bin = "badge-client"
path = "/boot/badge-client"

[[programs]]
package = "testrunner"
bin = "log-client-fixture"
path = "/boot/log-client-fixture"

[[programs]]
package = "testrunner"
bin = "namespace-consumer-fixture"
path = "/boot/namespace-consumer-fixture"

[[programs]]
package = "testrunner"
bin = "filesystem-client-fixture"
path = "/boot/filesystem-client-fixture"

[[programs]]
package = "testrunner"
bin = "directory-consumer-fixture"
path = "/boot/directory-consumer-fixture"

[[programs]]
package = "testrunner"
bin = "unresponsive-filesystem"
path = "/boot/unresponsive-filesystem"

[[programs]]
package = "testrunner"
bin = "managed-startup-fixture"
path = "/boot/managed-startup-fixture"

[[programs]]
package = "testrunner"
bin = "managed-startup-hung"
path = "/boot/managed-startup-hung"

[[programs]]
package = "testrunner"
bin = "managed-startup-closed"
path = "/boot/managed-startup-closed"

[[programs]]
package = "testrunner"
bin = "crash-filesystem"
path = "/boot/crash-filesystem"

[[programs]]
package = "driver-pl031"
path = "/boot/driver-pl031"

[[programs]]
package = "namespace-router"
path = "/boot/namespace-router"

[[programs]]
package = "filesystem-ramfs"
path = "/boot/filesystem-ramfs"

[[programs]]
package = "filesystem-imagefs"
path = "/boot/filesystem-imagefs"

[[files]]
path = "/boot/testrunner/sample"
source = "user/testrunner/assets/sample.txt"

[[files]]
path = "/boot/testrunner/empty"
source = "user/testrunner/assets/empty.txt"

[[files]]
path = "/boot/directory-consumer-fixture/sample"
source = "user/testrunner/assets/area.txt"
