cargo-features = ["per-package-target"]

[package]
name = "testrunner"
version.workspace = true
edition.workspace = true
publish.workspace = true
build = "build.rs"
forced-target = "aarch64-unknown-none"

[package.metadata.userland]
bootstrap = true
stack_size = 65536

[[bin]]
name = "testrunner"
path = "src/main.rs"
test = false
bench = false

[dependencies]
bootstrap = { workspace = true }
collections = { workspace = true }
io = { workspace = true }
ipc = { workspace = true }
spin = { workspace = true }
test-harness-qemu = { workspace = true }
syscall = { workspace = true }
runtime = { workspace = true }

[lints]
workspace = true
