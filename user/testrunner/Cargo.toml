cargo-features = ["per-package-target"]

[package]
name = "testrunner"
version.workspace = true
edition.workspace = true
publish.workspace = true
build = "build.rs"
forced-target = "aarch64-unknown-none"

[package.metadata.userland]
stack_size = 65536

[[bin]]
name = "testrunner"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "spawn-fixture"
path = "src/spawn_fixture.rs"
test = false
bench = false

[[bin]]
name = "startup-fixture"
path = "src/startup_fixture.rs"
test = false
bench = false

[[bin]]
name = "port-fixture"
path = "src/port_fixture.rs"
test = false
bench = false

[[bin]]
name = "reply-holder"
path = "src/reply_holder.rs"
test = false
bench = false

[[bin]]
name = "badge-client"
path = "src/badge_client.rs"
test = false
bench = false

[[bin]]
name = "filesystem-client-fixture"
path = "src/filesystem_client_fixture.rs"
test = false
bench = false

[[bin]]
name = "unresponsive-filesystem"
path = "src/unresponsive_filesystem.rs"
test = false
bench = false

[dependencies]
bootstrap = { workspace = true }
collections = { workspace = true }
fdt = { workspace = true }
filesystem-abi = { workspace = true }
io = { workspace = true }
ipc = { workspace = true }
spin = { workspace = true }
test-harness-qemu = { workspace = true }
syscall = { workspace = true }
runtime = { workspace = true }
userland = { workspace = true }
userland-image = { workspace = true }
userland-loader = { workspace = true }

[build-dependencies]
userland-build = { workspace = true }

[lints]
workspace = true
