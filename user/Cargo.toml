# Userspace отделён от корневого workspace: сборка `std` из исходников несовместима с
# `forced-target`. Таргет и флаги сборки лежат в `.cargo/config.toml` рядом.
[workspace]
resolver = "3"
members = [
    "calculator-demo",
    "clock-std",
    "driver-pl031",
    "filesystem-imagefs",
    "filesystem-ramfs",
    "hello-std",
    "namespace-router",
    "rootkeeper",
    "testrunner",
    "../lib/filesystem-server",
    "../lib/log-relay",
    "../lib/managed-component",
    "../lib/runtime",
    "../lib/userland-loader",
]

# `check-layers` метит крейты workspace архитектурными по этому ключу.
[workspace.metadata.molecular]
arch = "aarch64"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# Внешние зависимости
spin = "0.12.0"
talc = { version = "4", default-features = false }

# Крейты userspace
filesystem-server = { path = "../lib/filesystem-server" }
log-relay = { path = "../lib/log-relay" }
managed-component = { path = "../lib/managed-component" }
runtime = { path = "../lib/runtime" }
userland-loader = { path = "../lib/userland-loader" }

# Крейты корневого workspace. Пути сверяет `cargo xtask check-layers`.
bootstrap-abi = { path = "../lib/bootstrap-abi" }
collections = { path = "../lib/collections" }
component-abi = { path = "../lib/component-abi" }
device-resolver = { path = "../lib/device-resolver" }
device-resolver-aarch64 = { path = "../lib/device-resolver-aarch64" }
fdt = { path = "../lib/fdt" }
filesystem = { path = "../lib/filesystem" }
filesystem-abi = { path = "../lib/filesystem-abi" }
io = { path = "../lib/io" }
ipc = { path = "../lib/ipc" }
log-abi = { path = "../lib/log-abi" }
molecular-rt = { path = "../lib/std-rt" }
rtc-abi = { path = "../lib/rtc-abi" }
rootkeeper-abi = { path = "../lib/rootkeeper-abi" }
syscall = { path = "../lib/syscall" }
test-harness-qemu = { path = "../lib/test-harness-qemu" }
userland = { path = "../lib/userland" }
userland-build = { path = "../lib/userland-build" }
userland-image = { path = "../lib/userland-image" }

# Таблица повторяет корневую дословно, комментарии к отдельным правилам лежат там же.
# Расхождение ловит `cargo xtask check-layers`.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unsafe_code = "deny"
# Имя таргета Molecular OS задаёт спека в `targets/`, встроенным rustc его не знает: хостовая
# сборка иначе ругается на `target_os` из кода, общего с userspace.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("molecular"))'] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_docs_in_private_items = "allow"
doc_markdown = "allow"
inline_always = "allow"
return_self_not_must_use = "allow"
undocumented_unsafe_blocks = "warn"
unwrap_used = "deny"
cast_possible_truncation = "allow"
cast_sign_loss = "warn"
cast_lossless = "warn"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = true
opt-level = 2
