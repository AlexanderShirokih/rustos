# Userspace отделён от корневого workspace: сборка `std` из исходников несовместима с
# `forced-target`. Таргет и флаги сборки лежат в `.cargo/config.toml` рядом.
[workspace]
resolver = "3"
members = [
    "examples/calculator-demo",
    "examples/clock-std",
    "examples/files-demo",
    "examples/hello-c",
    "examples/hello-std",
    "examples/slint-demo",
    "system/driver-pl031",
    "system/driver-pm8941-pwrkey",
    "system/driver-pm8941-rtc",
    "system/driver-simplefb",
    "system/driver-virtio-gpu",
    "system/driver-virtio-input",
    "system/filesystem-imagefs",
    "system/filesystem-ramfs",
    "system/input-hub",
    "system/mounts",
    "system/platform",
    "system/rootkeeper",
    "system/spmi-pmic-arb",
    "system/virtio-mmio",
    "testing/c-selftest",
    "testing/cxx-exit",
    "testing/cxx-selftest",
    "testing/std-selftest",
    "testing/testrunner",
    "../lib/c-library",
    "../lib/component-startup",
    "../lib/components",
    "../lib/filesystem-server",
    "../lib/log-relay",
    "../lib/managed-component",
    "../lib/userland-loader",
    "../lib/virtio-driver",
]

[workspace.metadata.molecular]
profile = "userland"

[workspace.package]
license = "MIT"
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# Внешние зависимости
spin = "0.12.0"

# Крейты userspace
c-library = { path = "../lib/c-library" }
component-startup = { path = "../lib/component-startup" }
components = { path = "../lib/components" }
filesystem-server = { path = "../lib/filesystem-server" }
log-relay = { path = "../lib/log-relay" }
managed-component = { path = "../lib/managed-component" }
runtime = { path = "../lib/runtime" }
userland-loader = { path = "../lib/userland-loader" }
virtio-driver = { path = "../lib/virtio-driver" }

# Крейты корневого workspace
bootstrap-abi = { path = "../lib/bootstrap-abi" }
component-abi = { path = "../lib/component-abi" }
device-resolver = { path = "../lib/device-resolver" }
display-abi = { path = "../lib/display-abi" }
fdt = { path = "../lib/fdt" }
fdt-test = { path = "../lib/fdt-test" }
filesystem = { path = "../lib/filesystem" }
filesystem-abi = { path = "../lib/filesystem-abi" }
filesystem-client = { path = "../lib/filesystem-client" }
input-abi = { path = "../lib/input-abi" }
io = { path = "../lib/io" }
ipc = { path = "../lib/ipc" }
kernel-objects = { path = "../lib/kernel-objects" }
log-abi = { path = "../lib/log-abi" }
platform-abi = { path = "../lib/platform-abi" }
program-entry = { path = "../lib/program-entry" }
rtc-abi = { path = "../lib/rtc-abi" }
spmi-abi = { path = "../lib/spmi-abi" }
syscall = { path = "../lib/syscall" }
syscall-user = { path = "../lib/syscall-user" }
test-harness = { path = "../lib/test-harness" }
userland = { path = "../lib/userland" }
userland-build = { path = "../lib/userland-build" }
userland-image = { path = "../lib/userland-image" }
virtio = { path = "../lib/virtio" }
virtio-mmio-abi = { path = "../lib/virtio-mmio-abi" }

# Таблица повторяет корневую дословно, комментарии к отдельным правилам лежат там же.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unsafe_code = "deny"
unreachable_pub = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("molecular"))'] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_docs_in_private_items = "allow"
doc_markdown = "allow"
inline_always = "allow"
return_self_not_must_use = "allow"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "deny"
unwrap_used = "deny"
unwrap_in_result = "deny"
expect_used = "deny"
indexing_slicing = "deny"
missing_asserts_for_indexing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
std_instead_of_core = "deny"
cast_sign_loss = "warn"
cast_lossless = "warn"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = true
opt-level = 2
