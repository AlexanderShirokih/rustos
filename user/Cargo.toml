# Userspace отделён от корневого workspace: сборка `std` из исходников несовместима с
# `forced-target`. Таргет и флаги сборки лежат в `.cargo/config.toml` рядом.
[workspace]
resolver = "3"
members = [
    "examples/calculator-demo",
    "examples/clock-std",
    "examples/files-demo",
    "examples/hello-std",
    "system/driver-pl031",
    "system/filesystem-imagefs",
    "system/filesystem-ramfs",
    "system/namespace-router",
    "system/rootkeeper",
    "testing/std-selftest",
    "testing/testrunner",
    "../lib/component-startup",
    "../lib/component-startup-std",
    "../lib/filesystem-server",
    "../lib/log-relay",
    "../lib/managed-component",
    "../lib/userland-loader",
]

# Архитектурно зависимый крейт объявляет архитектуру ключом `arch` своего манифеста.
[workspace.metadata.molecular]
profile = "userland"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# Внешние зависимости
spin = "0.12.0"

# Крейты userspace
component-startup = { path = "../lib/component-startup" }
component-startup-std = { path = "../lib/component-startup-std" }
filesystem-server = { path = "../lib/filesystem-server" }
log-relay = { path = "../lib/log-relay" }
managed-component = { path = "../lib/managed-component" }
runtime = { path = "../lib/runtime" }
userland-loader = { path = "../lib/userland-loader" }

# Крейты корневого workspace
bootstrap-abi = { path = "../lib/bootstrap-abi" }
collections = { path = "../lib/collections" }
component-abi = { path = "../lib/component-abi" }
device-resolver = { path = "../lib/device-resolver" }
device-resolver-aarch64 = { path = "../lib/device-resolver-aarch64" }
fdt = { path = "../lib/fdt" }
filesystem = { path = "../lib/filesystem" }
filesystem-abi = { path = "../lib/filesystem-abi" }
filesystem-client = { path = "../lib/filesystem-client" }
io = { path = "../lib/io" }
ipc = { path = "../lib/ipc" }
kernel-objects = { path = "../lib/kernel-objects" }
log-abi = { path = "../lib/log-abi" }
rtc-abi = { path = "../lib/rtc-abi" }
syscall = { path = "../lib/syscall" }
syscall-user = { path = "../lib/syscall-user" }
test-harness-qemu = { path = "../lib/test-harness-qemu" }
userland = { path = "../lib/userland" }
userland-build = { path = "../lib/userland-build" }
userland-image = { path = "../lib/userland-image" }

# Таблица повторяет корневую дословно, комментарии к отдельным правилам лежат там же.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("molecular"))'] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_docs_in_private_items = "allow"
doc_markdown = "allow"
inline_always = "allow"
return_self_not_must_use = "allow"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "deny"
unwrap_used = "deny"
unwrap_in_result = "deny"
expect_used = "deny"
indexing_slicing = "deny"
missing_asserts_for_indexing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
std_instead_of_core = "deny"
cast_sign_loss = "warn"
cast_lossless = "warn"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = true
opt-level = 2
