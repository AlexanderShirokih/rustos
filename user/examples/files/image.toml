version = 1

[plan]
source = "user/examples/files/system.toml"

[[programs]]
package = "rootkeeper"
path = "/rootkeeper"
boot = true

[[programs]]
package = "platform"
path = "/platform"

[[programs]]
package = "driver-simplefb"
path = "/driver-simplefb"

[[programs]]
package = "virtio-mmio"
path = "/virtio-mmio"

[[programs]]
package = "driver-virtio-gpu"
path = "/driver-virtio-gpu"

[[programs]]
package = "mounts"
path = "/mounts"

[[programs]]
package = "filesystem-imagefs"
path = "/filesystem-imagefs"

[[programs]]
package = "filesystem-ramfs"
path = "/filesystem-ramfs"

[[programs]]
package = "input-hub"
path = "/input-hub"

[[programs]]
package = "driver-virtio-input"
path = "/driver-virtio-input"

[[programs]]
package = "files"
path = "/files"

[[files]]
path = "/mounts/table"
source = "user/examples/files/mounts"

[[files]]
path = "/files/system.toml"
source = "user/examples/files/system.toml"
