cargo-features = ["per-package-target"]

[package]
name = "rootkeeper"
version.workspace = true
edition.workspace = true
publish.workspace = true
build = "build.rs"
forced-target = "aarch64-unknown-none"

[package.metadata.userland]
stack_size = 65536

[[bin]]
name = "rootkeeper"
path = "src/main.rs"
test = false
bench = false

[lib]
test = false
bench = false
doctest = false

[dependencies]
bootstrap-abi = { workspace = true }
device-resolver = { workspace = true }
device-resolver-aarch64 = { workspace = true }
fdt = { workspace = true }
log-abi = { workspace = true }
log-relay = { workspace = true }
managed-component = { workspace = true }
runtime = { workspace = true }
spin = { workspace = true }
syscall = { workspace = true }
userland-image = { workspace = true }

[build-dependencies]
userland-build = { workspace = true }

[lints]
workspace = true
