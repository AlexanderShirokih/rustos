version = 1

[plan]
source = "user/rootkeeper/system.toml"

[stage1]
source = "user/rootkeeper/stage1.toml"

[[mount_tables]]
source = "user/rootkeeper/namespace.toml"

[[programs]]
package = "rootkeeper"
path = "/boot/rootkeeper"
boot = true

[[programs]]
package = "driver-pl031"
path = "/boot/driver-pl031"

[[programs]]
package = "namespace-router"
path = "/boot/namespace-router"

[[programs]]
package = "init"
path = "/boot/init"

[[programs]]
package = "filesystem-imagefs"
path = "/boot/filesystem-imagefs"

[[programs]]
package = "filesystem-ramfs"
path = "/boot/filesystem-ramfs"

[[programs]]
package = "hello-std"
path = "/boot/hello-std"

[[programs]]
package = "clock-std"
path = "/boot/clock-std"
