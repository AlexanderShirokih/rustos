# Конфигурация cargo-deny для RustOS Mobile
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# Устаревшие поля vulnerability/notice удалены в cargo-deny 0.19+:
# уязвимости и notice теперь всегда считаются ошибкой, пока не в ignore.
unmaintained = "workspace"
yanked = "warn"

[licenses]
# Устаревшие поля unlicensed/copyleft удалены в cargo-deny 0.19+:
# лицензии вне allow по умолчанию запрещены.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]

[licenses.private]
# Внутренние workspace-крейты без поля license в манифесте.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# workspace = true для path-зависимостей в непубликуемых крейтах - не semver-*.
allow-wildcard-paths = true

[bans.workspace-dependencies]
# Не требовать дублирования объявлений path-членов в [workspace.dependencies].
duplicates = "allow"
include-path-dependencies = false
unused = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
